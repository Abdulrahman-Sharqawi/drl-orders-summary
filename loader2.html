<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DTV Dream Realization Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --dtv-blue: #1B3FA0;
      --dtv-orange: #F47920;
      --dtv-teal: #3CBFB8;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { width: 100%; height: 100%; overflow: hidden }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #302f2f;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #003594;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #loader.gone { display: none }

    #loader.reenter {
      animation: loader-enter 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes loader-enter {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .loader-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .ll {
      stroke-dasharray: var(--len, 800);
      stroke-dashoffset: var(--len, 800);
      animation: draw 1.4s cubic-bezier(.4, 0, .2, 1) var(--d, 0ms) forwards;
    }

    @keyframes draw { to { stroke-dashoffset: 0 } }

    @keyframes undraw {
      from { stroke-dashoffset: 0 }
      to   { stroke-dashoffset: var(--len, 800) }
    }

    .loader-logo.exit-logo {
      animation: exit-logo 0.45s cubic-bezier(0.76, 0, 0.24, 1) forwards !important;
    }

    @keyframes exit-logo {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(12px); }
    }

    .loader-sub.exit-sub,
    .loader-enter-btn.exit-btn {
      animation: fade-out 0.3s ease forwards !important;
    }

    @keyframes fade-out { to { opacity: 0 } }

    .loader-bar-fill.exit-bar {
      animation: shrink-bar 0.6s ease-in forwards !important;
    }

    @keyframes shrink-bar {
      from { width: 100% }
      to   { width: 0% }
    }

    #loader.exit-screen {
      animation: screen-out 0.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    }

    @keyframes screen-out {
      from { opacity: 1 }
      to   { opacity: 0 }
    }

    .loader-brand {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    .loader-logo {
      width: clamp(260px, 38vw, 420px);
      opacity: 0;
      transform: translateY(14px);
      animation: lup .65s var(--ease) .85s forwards;
      filter: brightness(0) invert(1);
    }

    .loader-sub {
      font-size: 1.125rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      animation: lup .5s var(--ease) 1.1s forwards;
    }

    .loader-enter-btn {
      margin-top: 1rem;
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      padding: .85em 2.2em;
      border: 2px solid rgba(255, 255, 255, .45);
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-family: inherit;
      font-size: 1.0625rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: background .25s, border-color .25s, transform .25s;
    }

    .loader-enter-btn.ready {
      opacity: 1;
      pointer-events: auto;
      animation: lup .5s var(--ease) forwards, pulse-ring 2s ease-in-out 0.5s infinite;
    }

    .loader-enter-btn:hover {
      background: rgba(255, 255, 255, .16);
      border-color: #fff;
      transform: scale(1.04);
    }

    .loader-enter-btn svg {
      flex-shrink: 0;
      animation: arrow-nudge 1.4s ease-in-out infinite;
    }

    @keyframes arrow-nudge {
      0%, 100% { transform: translateX(0) }
      50%       { transform: translateX(4px) }
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .28) }
      50%       { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0) }
    }

    @keyframes lup {
      to { opacity: 1; transform: translateY(0) }
    }

    .loader-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(27, 63, 160, .08);
    }

    .loader-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--dtv-teal), var(--dtv-orange));
      width: 0;
      animation: lbar 2s var(--ease) .15s forwards;
    }

    @keyframes lbar {
      0%   { width: 0 }
      55%  { width: 68% }
      85%  { width: 90% }
      100% { width: 100% }
    }

    @media (max-width: 520px) {
      .loader-brand {
        gap: 1.25rem;
        padding: 0 max(1rem, env(safe-area-inset-left)) 0 max(1rem, env(safe-area-inset-right));
      }
      .loader-logo { width: min(78vw, 300px); }
      .loader-sub {
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-align: center;
        line-height: 1.4;
      }
      .loader-enter-btn {
        font-size: 0.9rem;
        padding: 0.75em 1.5em;
        gap: 0.55rem;
      }
    }
  </style>
</head>
<body>

  <div id="loader" aria-hidden="true" role="presentation">

    <svg class="loader-bg" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" fill="none"
      preserveAspectRatio="xMidYMid slice">
      <path class="ll" d="M1440 110 L910 110 L888 132 L888 230" stroke="#00C7B1" stroke-width="26"
        stroke-linecap="square" style="--len:720;--d:80ms" opacity=".65" />
      <line class="ll" x1="1120" y1="0" x2="1120" y2="320" stroke="#FF8200" stroke-width="26" stroke-linecap="square"
        style="--len:320;--d:260ms" opacity=".55" />
      <line class="ll" x1="1440" y1="310" x2="820" y2="310" stroke="#FFFFFF" stroke-width="20" stroke-linecap="square"
        style="--len:620;--d:180ms" opacity=".12" />
      <path class="ll" d="M0 260 L520 260 L542 282 L542 900" stroke="#FFFFFF" stroke-width="26" stroke-linecap="square"
        style="--len:920;--d:0ms" opacity=".1" />
      <path class="ll" d="M0 460 L360 460 L382 482 L382 900" stroke="#FFFFFF" stroke-width="16" stroke-linecap="square"
        style="--len:600;--d:200ms" opacity=".08" />
      <path class="ll" d="M0 680 L260 680 L282 702 L282 900" stroke="#00C7B1" stroke-width="22" stroke-linecap="square"
        style="--len:480;--d:360ms" opacity=".4" />
      <line class="ll" x1="1440" y1="560" x2="680" y2="560" stroke="#FFFFFF" stroke-width="20" stroke-linecap="square"
        style="--len:760;--d:140ms" opacity=".1" />
      <line class="ll" x1="1440" y1="780" x2="900" y2="780" stroke="#FF8200" stroke-width="14" stroke-linecap="square"
        style="--len:540;--d:420ms" opacity=".35" />
    </svg>

    <div class="loader-brand">
      <img class="loader-logo" src="drl_logo.png" alt="DTV Ventures">
      <span class="loader-sub">DTV &nbsp;·&nbsp; Student Clubs Governance Model</span>
      <button id="loader-enter-btn" class="loader-enter-btn" type="button">
        Enter
        <svg width="18" height="18" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div class="loader-bar">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      var enterBtn = document.getElementById('loader-enter-btn');

      var leaving = false;

      function hideLoader() {
        if (leaving) return;
        leaving = true;
        try { sessionStorage.setItem('dtv-from-clubs-loader', '1'); } catch (e) {}

        var logo = loader.querySelector('.loader-logo');
        var sub = loader.querySelector('.loader-sub');
        var barFill = loader.querySelector('.loader-bar-fill');
        var lines = Array.prototype.slice.call(loader.querySelectorAll('.ll'));

        enterBtn.classList.add('exit-btn');
        if (sub) sub.classList.add('exit-sub');

        setTimeout(function () {
          if (barFill) barFill.classList.add('exit-bar');
        }, 120);

        setTimeout(function () {
          if (logo) logo.classList.add('exit-logo');
        }, 220);

        var entryDelays = [80, 260, 0, 140, 0, 200, 140, 420];
        var maxDelay = 420;

        setTimeout(function () {
          lines.forEach(function (line, i) {
            var undrawDelay = maxDelay - (entryDelays[i] || 0);
            line.style.strokeDashoffset = '0';
            line.style.animation = 'none';
            line.getBoundingClientRect();
            line.style.animation =
              'undraw 1.0s cubic-bezier(0.76,0,0.24,1) ' + undrawDelay + 'ms forwards';
          });
        }, 400);

        setTimeout(function () { loader.classList.add('exit-screen'); }, 1480);
        setTimeout(function () {
          loader.classList.add('gone');
          window.location.href = 'KFUPM_Student_Clubs_Governance.html';
        }, 2000);
      }

      setTimeout(function () {
        enterBtn.classList.add('ready');
      }, 1800);

      loader.addEventListener('click', hideLoader);
      enterBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        hideLoader();
      });
    }());
  </script>
</body>
</html>
